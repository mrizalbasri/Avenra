services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avenra
      POSTGRES_USER: avenra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - avenra-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avenra -d avenra']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  avenra-db:
